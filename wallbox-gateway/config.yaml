name: "Wallbox BLE Gateway Manager"
version: "0.32.0"
slug: wallbox_gateway
description: >
  Manage your ESP32-based Wallbox BLE gateway from inside Home Assistant.
  Live status + controls dashboard, a charge-schedule editor (create /
  edit / delete), and drag-and-drop OTA firmware upload with end-to-end
  MD5 integrity check.
url: "https://github.com/botts7/wallbox-gateway-ha-addon"
image: "ghcr.io/botts7/wallbox-gateway-{arch}"
arch:
  - amd64
  - aarch64
init: false
ingress: true
# Lets the Add-on backend read HA entity states (for the Charge Assistant
# entity pickers + live preview) and call the wallbox_gateway config services.
# Same grant ESPHome / Node-RED use. SUPERVISOR_TOKEN is held by the Flask
# backend only and is never exposed to the browser.
homeassistant_api: true
panel_icon: mdi:ev-station
panel_title: "Wallbox Gateway"
options:
  gateway_ip: ""
  gateway_auth_user: "admin"
  gateway_auth_pass: ""
  poll_interval_s: 10
schema:
  gateway_ip: "str?"
  gateway_auth_user: "str?"
  gateway_auth_pass: "password?"
  poll_interval_s: "int(5,300)?"
