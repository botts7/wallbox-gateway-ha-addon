name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-lint:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run frenck/action-addon-linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./wallbox-gateway

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: wallbox-gateway/Dockerfile
          # DL3018 + DL3013: alpine pin-version / pip install skip
          # DL3006: FROM ${BUILD_FROM} — BUILD_FROM is the HA builder's
          #         dynamic base-image ARG; it IS tagged at build time
          #         but hadolint can't see through the ARG.
          ignore: DL3018,DL3013,DL3006

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: wallbox-gateway/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false
